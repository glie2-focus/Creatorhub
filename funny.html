<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLIE FUNNY HUB 👑 - Post Your Funny</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFC400;--bg:#080808;--card:#151515;--line:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif}
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:10}
.logo{font-family:Anton;font-size:20px}.logo b{color:var(--gold)}
.btn{background:var(--gold);color:#000;border:0;padding:10px 18px;border-radius:999px;font-weight:900;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.main{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:340px 1fr;gap:16px}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin:6px 0}
.feed{display:grid;gap:16px}
.post img,.post video{width:100%;max-height:500px;object-fit:cover;display:block}
.post .info{padding:12px}
.actions{display:flex;gap:12px;padding:0 12px 12px 12px}
.actions button{background:#222;border:0;color:#fff;padding:8px 14px;border-radius:999px;cursor:pointer}
.actions button:hover{background:var(--gold);color:#000}
.user{font-family:Anton;letter-spacing:.5px}
@media(max-width:850px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo">👑 GLIE <b>FUNNY HUB</b></div>
<div id="authBox"><button class="btn" onclick="document.getElementById('loginModal').style.display='flex'">LOGIN / JOIN</button></div>
</header>

<div class="main">
<!-- LEFT: CREATE POST -->
<div class="card" style="padding:16px;height:fit-content;position:sticky;top:80px">
<h3 style="font-family:Anton;margin:0 0 10px 0">CREATE FUNNY POST 😂</h3>
<p style="color:#777;font-size:12px">Banza ukore account hejuru</p>
<input id="title" placeholder="Umutwe - nka: Umukobwa yanyibye 😂">
<textarea id="desc" placeholder="Sobanura..."></textarea>
<select id="type"><option value="photo">Photo 🤳</option><option value="video">Video 🎬</option></select>
<input type="file" id="fileInput" accept="image/*,video/*">
<p style="font-size:11px;color:#666">cyangwa shyiramo link ya YouTube/Img:</p>
<input id="url" placeholder="https://...">
<button class="btn" style="width:100%;margin-top:10px" onclick="createPost()">🚀 POST NOW</button>
<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
<div style="font-size:12px;color:#888">💡 <b>Igice cyawe:</b> Abantu bakora account bashobora gukora post zabo - zigaragara hano ako kanya! Kigali Funny Community 👑</div>
</div>

<!-- RIGHT: FEED -->
<div class="feed" id="feed"></div>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:20;align-items:center;justify-content:center;padding:16px">
<div class="card" style="padding:20px;width:100%;max-width:360px">
<h2 style="font-family:Anton;margin:0">JOIN GLIE FAMILY 👑</h2>
<input id="username" placeholder="Izina ryawe - nka: KingGlie">
<input id="userpic" placeholder="Link y'ifoto yawe (optional)">
<button class="btn" style="width:100%;margin-top:10px" onclick="login()">✨ KORA ACCOUNT YANJYE</button>
<button style="width:100%;margin-top:8px;background:transparent;color:#777;border:0;cursor:pointer" onclick="document.getElementById('loginModal').style.display='none'">Close</button>
</div>
</div>

<script>
let currentUser = JSON.parse(localStorage.getItem('glie_user')||'null');
let posts = JSON.parse(localStorage.getItem('glie_posts')||'[]');
if(posts.length===0){
 posts=[{id:1,user:'GLIE UNFILTERED 👑',title:'LOVE OR MONEY? Kigali street 😂',desc:'Abantu b'i Kigali baraduteye ubwoba! Watch till end!',type:'photo',media:'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=600',likes:124,time:'2h ago'},{id:2,user:'MamaComedy',title:'Umugabo wanjye yibye inkoko 😭😂',desc:'Ninkuru yacu!',type:'video',media:'https://www.w3schools.com/html/mov_bbb.mp4',likes:89,time:'5h ago'}];
}

function updateAuth(){
 const b=document.getElementById('authBox');
 if(currentUser){b.innerHTML=`<span style="margin-right:10px">👋 <b>${currentUser.name}</b></span><button class="btn" style="background:#222;color:#fff" onclick="logout()">Logout</button>`}
}
function login(){
 const name=document.getElementById('username').value.trim();
 if(!name) return alert('Shyiramo izina!');
 currentUser={name,pic:document.getElementById('userpic').value||''};
 localStorage.setItem('glie_user',JSON.stringify(currentUser));
 document.getElementById('loginModal').style.display='none';
 updateAuth();
}
function logout(){localStorage.removeItem('glie_user');location.reload()}

function createPost(){
 if(!currentUser) return alert('Banza ukore account! Kanda LOGIN hejuru 👆'), document.getElementById('loginModal').style.display='flex';
 const title=document.getElementById('title').value.trim();
 if(!title) return alert('Shyiramo umutwe!');
 const file=document.getElementById('fileInput').files[0];
 let media=document.getElementById('url').value.trim();
 if(file){media=URL.createObjectURL(file)}
 if(!media) return alert('Hitamo ifoto/video cyangwa shyiramo link!');
 const p={id:Date.now(),user:currentUser.name,title,desc:document.getElementById('desc').value,type:document.getElementById('type').value,media,likes:0,time:'now'};
 posts.unshift(p);
 localStorage.setItem('glie_posts',JSON.stringify(posts));
 render(); document.getElementById('title').value='';document.getElementById('desc').value='';document.getElementById('url').value='';
 alert('Post yawe yashyizweho! 🔥👑');
}

function render(){
 const feed=document.getElementById('feed'); feed.innerHTML='';
 posts.forEach(p=>{
  const d=document.createElement('div'); d.className='card post';
  d.innerHTML=`<div style="padding:12px;display:flex;justify-content:space-between"><span class="user">👑 ${p.user}</span><span style="color:#666;font-size:11px">${p.time}</span></div>
  ${p.type==='video' && p.media.includes('.mp4') || p.media.startsWith('blob:') && p.type==='video' ? `<video src="${p.media}" controls></video>` : p.media.includes('youtube')||p.media.includes('youtu.be')? `<iframe width="100%" height="300" src="${p.media.replace('watch?v=','embed/')}" frameborder="0" allowfullscreen></iframe>` : `<img src="${p.media}">`}
  <div class="info"><h3 style="font-family:Anton;margin:0">${p.title}</h3><p style="color:#999;font-size:13px;margin:6px 0">${p.desc||''}</p></div>
  <div class="actions"><button onclick="like(${p.id})">❤️ ${p.likes} Like</button><button>💬 Comment</button><button>↗️ Share</button></div>`;
  feed.appendChild(d);
 })
}
function like(id){const p=posts.find(x=>x.id===id);p.likes++;localStorage.setItem('glie_posts',JSON.stringify(posts));render()}
updateAuth(); render();
</script>
</body>
</html>
