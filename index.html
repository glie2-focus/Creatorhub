<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GLIE UNFILTERED - No Filter</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#FFC400;--bg:#050505;--line:#222}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif}
header{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);z-index:10}
.logo{font-family:Anton;font-size:22px;letter-spacing:1px} .logo span{color:var(--gold)}
.btn{background:var(--gold);color:#000;border:0;padding:11px 18px;border-radius:999px;font-weight:900;cursor:pointer}
.hero{max-width:1200px;margin:auto;padding:40px 16px;text-align:center}
.hero h1{font-family:Anton;font-size:56px;line-height:.9;margin:0;text-transform:uppercase} .hero h1 .g{color:var(--gold)}
.grid{max-width:1200px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#111;cursor:pointer} .card:hover{border-color:var(--gold)}
.card img{width:100%;height:300px;object-fit:cover;display:block}
.card .t{padding:12px} .card .t h4{margin:0;font-family:Anton;font-size:18px} .card .t small{color:#999}
.tag{color:var(--gold);font-weight:900;font-size:11px}
#loader{padding:40px;text-align:center;color:var(--gold);font-weight:900}
footer{border-top:1px solid var(--line);margin-top:40px;padding:30px;text-align:center;color:#777;font-size:13px}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:38px}}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo">👑 GU <span>GLIE UNFILTERED</span></div><button class="btn" onclick="document.getElementById('join').scrollIntoView({behavior:'smooth'})">SUBSCRIBE</button></header>
<div class="hero"><h1>REAL PEOPLE.<br><span class="g">REAL STORIES.</span><br>NO FILTER.</h1><p style="color:#999">GLIE UNFILTERED auto-loads your photos from GitHub. No rename needed!</p></div>
<div id="loader">⏳ Loading your 9 photos... 👑</div>
<div class="grid" id="grid"></div>
<div id="join" style="max-width:400px;margin:40px auto;padding:20px;border:1px solid #333;border-radius:20px;background:#111"><h3 style="font-family:Anton;margin:0">JOIN FAMILY 👑</h3><input id="n" placeholder="Izina" style="width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #333;background:#000;color:#fff"><button class="btn" style="width:100%" onclick="alert('Murakaza neza '+(document.getElementById('n').value||'King')+' muri GLIE FAMILY! 👑🔥')">JOIN NOW</button></div>
<footer>© 2026 GLIE UNFILTERED 👑 — Same Vision Bigger Dreams — Kigali</footer>
<script>
async function load(){
 const user='glie2-focus'; const repo='Creatorhub';
 try{
  const res=await fetch(`https://api.github.com/repos/${user}/${repo}/contents`);
  const files=await res.json();
  const imgs=files.filter(f=>f.name.match(/\.(jpg|jpeg|png|webp)$/i));
  const grid=document.getElementById('grid');
  const loader=document.getElementById('loader');
  loader.style.display='none';
  const titles=['LOVE OR MONEY? ❤️','5 SECONDS MAKE ME LAUGH 😂','1M RWF FIRST MOVE? 💰','PAIN NEVER ENDS..','DEAR PROBLEMS..','MORE MONEY BIGGER DREAMS','MAKE ME LAUGH CHALLENGE','STREET INTERVIEW KIGALI','GLIE UNFILTERED OFFICIAL 👑'];
  imgs.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<img src="${f.download_url}" loading="lazy"><div class="t"><span class="tag">${titles[i%titles.length]}</span><h4>${f.name.substring(0,15)}...</h4><small>GLIE UNFILTERED • No Filter</small></div>`;
    d.onclick=()=>window.open(f.download_url,'_blank');
    grid.appendChild(d);
  });
 }catch(e){document.getElementById('loader').innerHTML='Fungura GitHub Pages: https://glie2-focus.github.io/Creatorhub/';}
}
load();
</script>
</body>
</html>
